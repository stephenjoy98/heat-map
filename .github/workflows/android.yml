name: Android build

on:
  push:
  # Run by hand (or by Claude) to publish the current main as a stable release.
  workflow_dispatch:
    inputs:
      stable:
        description: Publish this build as a stable release (otherwise a beta)
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Writing a release (and its tag) needs write access to the repository's contents.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # Optional: without these secrets the app still builds, minus the map tiles and Firebase features.
      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase config added"
          else
            echo "No GOOGLE_SERVICES_JSON secret; building without Firebase"
          fi

      # Every push to main is a beta. A stable release is made on purpose: run the workflow with "stable"
      # ticked, or push a commit whose message contains [stable].
      - name: Choose the release channel
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          STABLE_INPUT: ${{ inputs.stable }}
        run: |
          if [ "$STABLE_INPUT" = "true" ] || printf '%s' "$COMMIT_MESSAGE" | grep -q '\[stable\]'; then ch=stable; else ch=beta; fi
          echo "BUILD_CHANNEL=$ch" >> "$GITHUB_ENV"
          echo "Channel: $ch"

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Read app version
        id: version
        run: echo "name=$(grep '^appVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: location-ticker-${{ steps.version.outputs.name }}-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      # On main, publish the build. A beta is a pre-release tagged vX.Y.Z-beta.N (N = run number), with the
      # changes since the last stable release; only the newest few betas are kept. A stable release is tagged
      # vX.Y.Z, marked latest, with every changelog entry since the previous stable release. A stable re-run of
      # the same version refreshes its APKs and notes. The build marker lets the app's updater tell builds apart.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          last_stable=$(gh release list --exclude-pre-releases --exclude-drafts --limit 20 --json tagName -q '.[].tagName' \
            | grep -vx "v$VERSION" | head -n1 | sed 's/^v//' || true)
          python3 -I tools/release_notes.py CHANGELOG.md "$VERSION" "$last_stable" > notes.md
          if [ "$BUILD_CHANNEL" = stable ]; then
            tag="v$VERSION"
            title="Location Ticker $VERSION"
          else
            tag="v$VERSION-beta.$GITHUB_RUN_NUMBER"
            title="Location Ticker $VERSION beta $GITHUB_RUN_NUMBER"
            printf 'Beta build: the newest changes before they go into a stable release.\n\n%s\n' "$(cat notes.md)" > notes.md
          fi
          printf '\n---\nInstall **location-ticker-%s.apk** (signed release build). The debug build is for testing.\n' "$VERSION" >> notes.md
          printf '\n<!-- build: %s -->\n' "$GITHUB_SHA" >> notes.md
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/location-ticker-$VERSION.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/location-ticker-$VERSION-debug.apk"
          if gh release view "$tag" > /dev/null 2>&1; then
            # APKs first, then the notes with the build marker, so the app never sees a marker for APKs that
            # didn't upload.
            gh release upload "$tag" dist/*.apk --clobber
            gh release edit "$tag" --title "$title" --notes-file notes.md
          elif [ "$BUILD_CHANNEL" = stable ]; then
            gh release create "$tag" dist/*.apk --target "$GITHUB_SHA" --title "$title" --notes-file notes.md --latest
          else
            gh release create "$tag" dist/*.apk --target "$GITHUB_SHA" --title "$title" --notes-file notes.md --prerelease --latest=false
          fi
          # Keep the three newest betas.
          gh release list --limit 100 --json tagName,isPrerelease -q '.[] | select(.isPrerelease) | .tagName' \
            | tail -n +4 | while read -r old; do gh release delete "$old" --yes --cleanup-tag; done

  # Installs the debug APK on an Android emulator, taps through the main screens and saves screenshots, a
  # screen recording and the logs (tools/emulator-smoke.sh). Results are uploaded as an artifact and pushed to
  # the ci-screenshots branch, so they can be looked at without signing in. Fails only if the app crashes.
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: location-ticker-${{ needs.build.outputs.version }}-apk
          path: apk

      # The emulator needs hardware acceleration, which GitHub's Linux runners allow once KVM is opened up.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Downloading the emulator sometimes fails on GitHub's side ("unknown archive"), so a failed run is tried
      # once more; a second failure (a crash both times, say) fails the job.
      - name: Run on the emulator
        id: emu
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/emulator-smoke.sh "$(find apk -name app-debug.apk | head -n1)" "${{ needs.build.outputs.version }}" emulator-output

      - name: Run on the emulator (second try)
        if: steps.emu.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: rm -rf emulator-output && bash tools/emulator-smoke.sh "$(find apk -name app-debug.apk | head -n1)" "${{ needs.build.outputs.version }}" emulator-output

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-${{ needs.build.outputs.version }}
          path: emulator-output

      # One commit, replaced each run, so the latest screenshots can be fetched with git.
      - name: Publish to the ci-screenshots branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          [ -d emulator-output ] || exit 0
          cd emulator-output
          printf '# Emulator run\n\nLocation Ticker %s, commit %s on %s, run %s.\n\nSee steps.txt for what was tapped.\n' \
            "$VERSION" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" > README.md
          git init -q
          git checkout -q -b ci-screenshots
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Emulator run for $VERSION ($GITHUB_SHA)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
